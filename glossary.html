<body>
<main>
  <header class="top">
    <h1>用語集 <span style="font-size:.8rem;font-weight:400;color:var(--muted)">付録</span></h1>
    <p>GNSSでよく出る用語を、別名（呼び方違い）とセットで引ける。日本語のみ</p>
  </header>

  <div class="panel">
    <p>同じ概念でも呼び方が複数ある用語（例: <b>PRN</b>＝<b>拡散符号</b>＝<b>スードランダムナンバー</b>）は、代表語のもとに<strong>別名をまとめて併記</strong>しています。検索欄には別名や英語でも入力できます。用語をクリックすると解説ページへ飛べるものもあります。</p>
  </div>

  <div class="tools">
    <div class="search">
      <input type="search" id="q" placeholder="用語・別名・英語で検索（例: 拡散符号 / PRN / spreading）" aria-label="用語を検索">
      <span class="count" id="count"></span>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div id="list"></div>
  <div class="empty" id="empty" hidden>該当する用語がありません。別の言葉で試してみてください。</div>
</main>

    { c: "threat", t: "信号認証", aka: ["メッセージ認証", "電子署名"], en: "Signal authentication", d: "信号に電子署名を付け、本物かどうかを受信機が検証する仕組み。スプーフィング対策。", l: ["qzss.html", "QZSS みちびき"] },

    { c: "sdr", t: "SDR", aka: ["ソフトウェア無線"], en: "Software Defined Radio", d: "受信した電波をソフトで処理する無線機。GNSS信号の受信・実験に使える。", l: ["sdr-intro.html", "SDR入門"] },
    { c: "sdr", t: "I/Q", aka: ["同相・直交", "IQサンプル"], en: "In-phase / Quadrature", d: "電波を同相(I)と直交(Q)の2成分で表したデジタルデータ。SDRの生データ。", l: ["sdr-spectrum.html", "SDRとスペクトル"] },
    { c: "sdr", t: "RBW", aka: ["分解能帯域幅"], en: "Resolution Bandwidth", d: "スペクトルの1本1本の細かさ。狭いほど雑音が下がり弱い信号が見える。", l: ["sdr-spectrum.html", "SDRとスペクトル"] },
    { c: "sdr", t: "ADC", aka: ["アナログデジタル変換器"], en: "Analog-to-Digital Converter", d: "アナログの電波をデジタルに変換する素子。ビット数がダイナミックレンジを決める。", l: ["sdr-spectrum.html", "SDRとスペクトル"] },

    { c: "alt", t: "PNT", aka: ["測位・航法・時刻"], en: "Positioning, Navigation, Timing", d: "GNSSが提供する3要素の総称。GNSSはPNTを得るための一手段にすぎない。", l: ["pnt-alternatives.html", "GNSSの代替"] },
    { c: "alt", t: "LEO-PNT", aka: ["低軌道測位"], en: "LEO PNT", d: "低軌道衛星による測位。信号が強く妨害に強い次世代PNT。", l: ["leo-pnt.html", "LEO-PNT"] },
    { c: "alt", t: "INS / IMU", aka: ["慣性航法装置", "慣性計測装置", "推測航法"], en: "Inertial Navigation System / Measurement Unit", d: "加速度計とジャイロで電波なしに自立測位。時間とともにドリフトする。", l: ["ins-imu.html", "慣性航法"] },
    { c: "alt", t: "eLoran", aka: ["拡張ロラン"], en: "enhanced Loran", d: "地上局の強力な長波による測位・時刻。妨害に強い独立系の代替。", l: ["terrestrial-rf.html", "地上系電波"] },
    { c: "alt", t: "SoOP", aka: ["信号機会測位"], en: "Signals of Opportunity", d: "Starlinkや携帯・TVなど測位用でない電波を測位に流用する手法。", l: ["soop.html", "信号機会測位"] },
    { c: "alt", t: "VPS", aka: ["ビジュアル測位", "環境標定"], en: "Visual Positioning System", d: "カメラ映像を地図・特徴点DBと照合して位置を出す方法。屋内に強い。", l: ["vps-mapmatch.html", "環境標定"] },

    { c: "coord", t: "ECEF", aka: ["地球中心地球固定座標"], en: "Earth-Centered Earth-Fixed", d: "地球の中心を原点にした直交座標系。GNSSの位置計算の土台。", l: ["coord-lab.html", "座標と高さ"] },
    { c: "coord", t: "楕円体高 / 標高", aka: ["ジオイド高", "海抜"], en: "Ellipsoidal height / Elevation", d: "楕円体高＝GPSが出す高さ。標高＝平均海面(ジオイド)基準の高さ。両者はずれる。", l: ["coord-lab.html", "座標と高さ"] },
  ];

  const listEl = document.getElementById("list");
  const emptyEl = document.getElementById("empty");
  const countEl = document.getElementById("count");
  const chipsEl = document.getElementById("chips");
  const qEl = document.getElementById("q");

  // build category chips
  let activeCat = "all";
  function mkChip(key, label) {
    const b = document.createElement("button");
    b.textContent = label; b.dataset.cat = key;
    if (key === "all") b.classList.add("on");
    b.addEventListener("click", () => {
      activeCat = key;
      chipsEl.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
      render();
    });
    chipsEl.appendChild(b);
  }
  mkChip("all", "すべて");
  Object.keys(CATS).forEach((k) => mkChip(k, CATS[k]));

  // precompute searchable text
  T.forEach((e) => { e._s = (e.t + " " + e.aka.join(" ") + " " + (e.en || "") + " " + e.d).toLowerCase(); });

  function render() {
    const q = qEl.value.trim().toLowerCase();
    listEl.innerHTML = "";
    let shown = 0;
    Object.keys(CATS).forEach((cat) => {
      if (activeCat !== "all" && activeCat !== cat) return;
      const items = T.filter((e) => e.c === cat && (activeCat !== "all" || true) && (!q || e._s.indexOf(q) >= 0));
      if (!items.length) return;
      const h = document.createElement("div"); h.className = "cat-h"; h.textContent = CATS[cat];
      listEl.appendChild(h);
      items.forEach((e) => {
        shown++;
        const d = document.createElement("div"); d.className = "gt";
        let html = '<div class="th"><span class="t">' + e.t + "</span>" + (e.en ? '<span class="en">' + e.en + "</span>" : "") + "</div>";
        if (e.aka.length) {
          html += '<div class="aka"><span class="eq">＝</span>' + e.aka.map((a) => '<span class="a">' + a + "</span>").join("") + "</div>";
        }
        html += '<div class="d">' + e.d + (e.l ? ' <a href="' + e.l[0] + '">→ ' + e.l[1] + "</a>" : "") + "</div>";
        d.innerHTML = html;
        listEl.appendChild(d);
      });
    });
    countEl.textContent = shown + " 語";
    emptyEl.hidden = shown > 0;
  }

  qEl.addEventListener("input", render);
  render();
})();
</script>
</body>
</html>
